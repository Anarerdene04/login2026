<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>로그인서버 · 게시판</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="/">모아<span>게시판</span></a>
        <div id="account-area" class="account-area"></div>
      </header>

      <section class="hero">
        <p class="eyebrow">작은 이야기, 편하게 나누기</p>
        <h1>오늘의 생각을<br><span>함께 나눠보세요.</span></h1>
        <p class="hero-copy">회원가입 후 로그인하면 누구나 글을 쓸 수 있어요.</p>
      </section>

      <section id="auth-panel" class="auth-panel card">
        <div class="auth-heading">
          <div>
            <p class="eyebrow">WELCOME</p>
            <h2 id="auth-title">로그인</h2>
          </div>
          <div class="auth-tabs" role="tablist" aria-label="계정 메뉴">
            <button class="tab active" type="button" data-mode="login" role="tab" aria-selected="true">로그인</button>
            <button class="tab" type="button" data-mode="register" role="tab" aria-selected="false">회원가입</button>
          </div>
        </div>
        <form id="auth-form">
          <label for="username">아이디</label>
          <input id="username" name="username" autocomplete="username" minlength="2" maxlength="20" required>
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
          <button id="auth-submit" class="button primary full" type="submit">로그인</button>
          <p id="auth-message" class="message" aria-live="polite"></p>
        </form>
        <p class="hint">비밀번호는 8자 이상으로 입력해 주세요.</p>
      </section>

      <section id="composer" class="composer card" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">NEW STORY</p>
            <h2>새 글 쓰기</h2>
          </div>
          <span class="write-mark" aria-hidden="true">✦</span>
        </div>
        <form id="post-form">
          <label for="post-title">제목</label>
          <input id="post-title" name="title" maxlength="100" placeholder="어떤 이야기를 나눠볼까요?" required>
          <label for="post-content">내용</label>
          <textarea id="post-content" name="content" rows="5" maxlength="5000" placeholder="편하게 이야기를 적어주세요." required></textarea>
          <div class="form-footer">
            <p id="post-message" class="message" aria-live="polite"></p>
            <button class="button primary" type="submit">게시하기 <span aria-hidden="true">→</span></button>
          </div>
        </form>
      </section>

      <section class="board">
        <div class="section-heading board-heading">
          <div>
            <p class="eyebrow">COMMUNITY</p>
            <h2>모두의 이야기</h2>
          </div>
          <span id="post-count" class="post-count">0개의 글</span>
        </div>
        <div id="post-list" class="post-list" aria-live="polite"></div>
      </section>
      <footer>모아게시판 <span>·</span> 서로의 이야기를 존중해 주세요.</footer>
    </main>
  </body>
</html>
